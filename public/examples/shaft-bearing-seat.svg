<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f5"/><stop offset="1" stop-color="#d9dee6"/></linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e7ed"/><stop offset=".5" stop-color="#aab4c2"/><stop offset="1" stop-color="#7d8796"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c40b8"/></marker>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#5b6575" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="40" fill="#2b313a"/>
  <text x="20" y="26" fill="#e5e7eb" font-size="16">Assembly2 — idler_shaft_support.SLDASM  [Section A-A]</text>
  <!-- housing section -->
  <rect x="430" y="170" width="260" height="110" fill="url(#hatch)" stroke="#3b4350" stroke-width="3"/>
  <rect x="430" y="440" width="260" height="110" fill="url(#hatch)" stroke="#3b4350" stroke-width="3"/>
  <!-- bearing seat cavity (empty) -->
  <rect x="490" y="280" width="140" height="160" fill="#eef1f5" stroke="#3b4350" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- shaft -->
  <rect x="120" y="320" width="900" height="80" rx="6" fill="url(#shaft)" stroke="#2b313a" stroke-width="3"/>
  <!-- collar groove location -->
  <rect x="660" y="312" width="70" height="96" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="640" y="300" fill="#b45309" font-size="18">collar here?</text>
  <line x1="80" y1="360" x2="1060" y2="360" stroke="#1c40b8" stroke-width="1.5" stroke-dasharray="14 5 3 5"/>
  <g stroke="#1c40b8" stroke-width="2" fill="none">
    <line x1="160" y1="320" x2="160" y2="400" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="560" y1="280" x2="560" y2="440" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="490" y1="600" x2="630" y2="600" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="490" y1="550" x2="490" y2="610"/><line x1="630" y1="550" x2="630" y2="610"/>
  </g>
  <g fill="#1c40b8" font-size="24" font-weight="bold">
    <text x="175" y="300">Ø12 h6</text>
    <text x="575" y="250">Ø28 H7 bearing seat</text>
    <text x="530" y="640">8.0</text>
  </g>
  <text x="790" y="470" fill="#3b4350" font-size="20">Belt load ≈ 2 kN radial</text>
  <path d="M900 480 v60" stroke="#b91c1c" stroke-width="4" marker-end="url(#a)"/>
  <text x="20" y="780" fill="#4b5563" font-size="16">Units: mm · Housing: Al 6061 · Shaft: hardened steel</text>
</svg>
