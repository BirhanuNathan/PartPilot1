<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f5"/><stop offset="1" stop-color="#d9dee6"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9c2cd"/><stop offset="1" stop-color="#8994a3"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c40b8"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="40" fill="#2b313a"/>
  <text x="20" y="26" fill="#e5e7eb" font-size="16">Assembly3 — hoist_base_plate.SLDPRT  [Top view]</text>
  <rect x="220" y="160" width="600" height="400" rx="6" fill="url(#steel)" stroke="#3b4350" stroke-width="3"/>
  <!-- bracket footprint -->
  <rect x="370" y="260" width="300" height="200" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="380" y="250" fill="#b45309" font-size="18">L-bracket 50×50×5 footprint (steel)</text>
  <!-- 4× M6 tapped holes -->
  <g>
    <g stroke="#3b4350" stroke-width="3" fill="#eef1f5">
      <circle cx="420" cy="310" r="16"/><circle cx="620" cy="310" r="16"/><circle cx="420" cy="410" r="16"/><circle cx="620" cy="410" r="16"/>
    </g>
    <g stroke="#3b4350" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
      <circle cx="420" cy="310" r="20"/><circle cx="620" cy="310" r="20"/><circle cx="420" cy="410" r="20"/><circle cx="620" cy="410" r="20"/>
    </g>
  </g>
  <g stroke="#1c40b8" stroke-width="2" fill="none">
    <line x1="420" y1="610" x2="620" y2="610" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="420" y1="430" x2="420" y2="620"/><line x1="620" y1="430" x2="620" y2="620"/>
    <line x1="870" y1="310" x2="870" y2="410" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="640" y1="310" x2="880" y2="310"/><line x1="640" y1="410" x2="880" y2="410"/>
    <line x1="634" y1="296" x2="760" y2="200" marker-start="url(#a)"/>
  </g>
  <g fill="#1c40b8" font-size="24" font-weight="bold">
    <text x="500" y="645">40</text>
    <text x="885" y="370">20</text>
    <text x="700" y="190">4× M6x1 ↧ 12 THREAD</text>
  </g>
  <text x="900" y="520" fill="#3b4350" font-size="20">Plate t = 8, S355 steel</text>
  <text x="900" y="550" fill="#b91c1c" font-size="20" font-weight="bold">Hoist load ≈ 6 kN</text>
  <text x="20" y="780" fill="#4b5563" font-size="16">Units: mm · Lifting application — see safety notes</text>
</svg>
